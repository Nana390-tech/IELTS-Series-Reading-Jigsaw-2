<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Honey Jigsaw Reading</title>
<style>
:root{
  --ink:#2B1A33; --muted:#6A5B70; --paper:#FFFBF2; --card:#FFFFFF; --line:#EADBC2;
  --A:#E39B0B; --A-l:#FFF1D2; --B:#6B3A84; --B-l:#F2E8F7; --AB:#2E7D6B; --AB-l:#E1F3EE;
  --ok:#1E8A55; --ok-l:#E3F5EA; --bad:#C23B35; --bad-l:#FBE5E3;
  --serif:Georgia,"Times New Roman",serif;
}
*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI",Tahoma,Arial,sans-serif;font-size:19px;line-height:1.6;color:var(--ink);background:var(--paper);
  background-image:radial-gradient(rgba(227,155,11,.13) 2px,transparent 2.5px);background-size:34px 34px}
button{font:inherit;cursor:pointer;color:inherit}
header{background:linear-gradient(135deg,#3A2147,#6B3A84);color:#fff;padding:20px 22px 0;position:relative;overflow:hidden}
header h1{margin:0;font-family:var(--serif);font-size:30px;font-weight:700}
header h1 .h{color:#FFC94A}
header p{margin:2px 0 14px;opacity:.9;font-size:17px}
.combs{position:absolute;right:14px;top:6px;font-size:58px;opacity:.25;letter-spacing:-8px}
nav.tabs{display:flex;gap:6px;flex-wrap:wrap;max-width:1100px;margin:0 auto}
nav.tabs button{border:0;border-radius:14px 14px 0 0;padding:10px 18px;font-weight:700;background:rgba(255,255,255,.14);color:#fff}
nav.tabs button[aria-selected="true"]{background:var(--paper);color:var(--ink)}
nav.tabs .dot{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:6px;vertical-align:middle}
main{max-width:1100px;margin:0 auto;padding:22px 18px 30px}
.warn{border-radius:14px;padding:12px 16px;margin-bottom:16px;font-weight:600;display:flex;gap:10px;align-items:flex-start}
.warn.A{background:var(--A-l);border:2px solid var(--A)}
.warn.B{background:var(--B-l);border:2px solid var(--B)}
.ar{direction:rtl;font-family:Tahoma,"Segoe UI",Arial,sans-serif;color:var(--B)}
.grid{display:grid;grid-template-columns:1fr 290px;gap:20px;align-items:start}
@media(max-width:860px){.grid{grid-template-columns:1fr}}
article.text{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:24px 28px;-webkit-user-select:text;user-select:text}
article.text.A{border-top:10px solid var(--A)}
article.text.B{border-top:10px solid var(--B)}
article.text h2{font-family:var(--serif);font-size:28px;margin:0 0 4px}
.lab{display:inline-block;font-size:14px;font-weight:800;border-radius:99px;padding:2px 12px;margin-bottom:6px;color:#fff}
.lab.A{background:var(--A)}.lab.B{background:var(--B)}.lab.AB{background:var(--AB)}
#paras p{font-size:20px;line-height:1.8;margin:0 0 16px}
aside.side{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:18px;position:sticky;top:12px}
aside.side h3{margin:0 0 8px;font-size:19px}
.hlbar{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 6px}
.pen{width:40px;height:40px;border-radius:50%;border:3px solid transparent;box-shadow:inset 0 0 0 2px rgba(0,0,0,.12)}
.pen[aria-pressed="true"]{border-color:var(--ink)}
.pen.y{background:#FFE58A}.pen.g{background:#BDEBC6}.pen.p{background:#F9C6D8}
.pen.er{background:#fff;font-size:18px}
.hlnote{font-size:14px;color:var(--muted);margin:0 0 6px}
.clearhl{background:none;border:0;text-decoration:underline;font-size:14px;padding:0;margin:0 0 16px;color:var(--muted)}
mark.hl{border-radius:3px;padding:0 1px;color:inherit}
mark.hl.y{background:#FFE58A}mark.hl.g{background:#BDEBC6}mark.hl.p{background:#F9C6D8}
body.erase #paras mark.hl{cursor:pointer;outline:1px dashed var(--bad)}
.words{list-style:none;margin:0 0 16px;padding:0;font-size:16px}
.words li{display:flex;justify-content:space-between;gap:10px;border-bottom:1px dashed var(--line);padding:5px 0}
.words b{color:var(--ink)}
.btn{border:0;border-radius:12px;padding:12px 20px;font-weight:700;background:var(--B);color:#fff;box-shadow:0 3px 0 #3A2147}
.btn.amber{background:var(--A);color:var(--ink);box-shadow:0 3px 0 #A86F00}
.btn.ghost{background:#fff;border:2px solid var(--line);box-shadow:none;color:var(--ink)}
.btn:active{transform:translateY(2px);box-shadow:none}
.full{width:100%}
.team{display:grid;grid-template-columns:1fr 1fr;gap:12px;background:#fff;border:2px solid var(--line);border-radius:16px;padding:16px;margin-bottom:18px}
@media(max-width:620px){.team{grid-template-columns:1fr}}
.team h3{grid-column:1/-1;margin:0;font-size:19px}
.team label{display:block;font-weight:700;font-size:15px;margin-bottom:4px}
.team input{width:100%;border:2px solid var(--line);border-radius:10px;padding:9px 12px;font-size:18px;background:#fff}
.team .a input{border-color:var(--A)}.team .b input{border-color:var(--B)}
.sec{background:#fff;border:2px solid var(--line);border-radius:18px;padding:20px 22px}
.sec h2{font-family:var(--serif);margin:0 0 4px;font-size:26px}
.inst{color:var(--muted);margin:0 0 12px}
.q{border:2px solid var(--line);border-radius:14px;padding:14px 16px;margin:12px 0;background:#fff}
.qh{display:flex;gap:10px;align-items:flex-start}
.num{flex:none;width:34px;height:34px;border-radius:50%;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px}
.qt{font-weight:600;padding-top:3px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
@media(max-width:620px){.opts{grid-template-columns:1fr}}
.opt{display:flex;gap:10px;align-items:center;text-align:left;border:2px solid var(--line);border-radius:12px;padding:9px 12px;background:#fff}
.opt .lt{font-weight:800;color:var(--B);min-width:18px}
.opt[aria-pressed="true"]{border-color:var(--B);background:var(--B-l)}
.tfrow{display:flex;gap:8px;margin-top:10px}
.tfrow .opt{flex:1;justify-content:center;font-weight:700;max-width:200px}
.short{margin-top:10px;width:100%;max-width:420px;border:2px solid var(--line);border-radius:10px;padding:9px 12px;font-size:18px}
.fig{margin:6px 0 20px;text-align:center;-webkit-user-select:none;user-select:none}
.fig svg{width:100%;max-width:620px;height:auto;display:block;margin:0 auto}
.fig figcaption{font-size:15px;color:var(--muted);font-style:italic;margin-top:6px}
.q.right{border-color:var(--ok);background:var(--ok-l)}
.q.wrong{border-color:var(--bad);background:var(--bad-l)}
.q.done .opt,.q.done .short{pointer-events:none}
.opt.correct{border-color:var(--ok)!important;background:#fff!important;box-shadow:0 0 0 2px var(--ok) inset}
.fb{margin-top:10px;font-size:16px}
.src{display:inline-block;font-size:13px;font-weight:800;border-radius:99px;padding:1px 10px;color:#fff;margin-right:6px}
.src.A{background:var(--A)}.src.B{background:var(--B)}.src.AB{background:var(--AB)}
.row{display:flex;gap:12px;flex-wrap:wrap;margin-top:16px}
.res{background:#fff;border:2px solid var(--line);border-radius:18px;padding:22px}
.big{font-size:60px;font-weight:900;font-family:var(--serif);line-height:1}
.split{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:18px 0}
@media(max-width:620px){.split{grid-template-columns:1fr}}
.sp{border-radius:14px;padding:14px;text-align:center;font-weight:700}
.sp b{display:block;font-size:30px;font-family:var(--serif)}
.sp.A{background:var(--A-l);border:2px solid var(--A)}.sp.B{background:var(--B-l);border:2px solid var(--B)}.sp.AB{background:var(--AB-l);border:2px solid var(--AB)}
.cert{margin-top:20px;border:10px double var(--A);border-radius:20px;padding:34px 26px;text-align:center;background:linear-gradient(#fff,#FFF6E0);position:relative}
.cert h4{font-family:var(--serif);font-size:36px;margin:4px 0 8px;color:var(--B)}
.cert .nm{font-family:var(--serif);font-size:32px;font-weight:700;margin:10px 0;border-bottom:2px solid var(--A);display:inline-block;padding:0 20px}
.seal{position:absolute;right:22px;top:22px;width:92px;height:92px;border-radius:50%;background:var(--A);color:var(--ink);font-weight:900;font-size:13px;display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.2;transform:rotate(-10deg);box-shadow:0 0 0 5px #FFE29A}
@media(max-width:620px){.seal{display:none}}
.empty{color:var(--muted);text-align:center;padding:30px}
#toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,140%);background:var(--ink);color:#fff;padding:12px 20px;border-radius:14px;font-weight:600;transition:transform .3s;z-index:50;max-width:92vw;text-align:center}
#toast.show{transform:translate(-50%,0)}
canvas#cf{position:fixed;inset:0;pointer-events:none;z-index:40}
footer{text-align:center;color:var(--muted);font-size:15px;padding:10px 0 30px}
@media print{
  header,nav,.noprint,footer,#toast,canvas{display:none!important}
  body{background:#fff}
  .res{border:0;padding:0}
  .cert{break-inside:avoid}
}
</style>
</head>
<body>
<header>
  <div class="combs">⬡⬡⬡</div>
  <h1>🐝 <span class="h">Honey</span>: Bees, Science and the UAE</h1>
  <p>A jigsaw reading for two · <span class="ar" style="color:#FFE29A">قراءة تعاونية لطالبتين</span></p>
  <nav class="tabs" role="tablist" id="tabs"></nav>
</header>
<main id="app"></main>
<footer>Designed by: Nazila Motahari</footer>
<div id="toast" role="status" aria-live="polite"></div>
<canvas id="cf"></canvas>
<script>

\n</g>\n<text x=\"195\" y=\"160\" text-anchor=\"middle\" font-family=\"Segoe UI,DejaVu Sans,Arial,sans-serif\" font-size=\"13.5\" font-weight=\"700\" fill=\"#2B1A33\">2. \"honey stomach\"</text>\n<text x=\"195\" y=\"177\" text-anchor=\"middle\" font-family=\"Segoe UI,DejaVu Sans,Arial,sans-serif\" font-size=\"12\" fill=\"#6A5B70\">carries it home</text>\n<path d=\"M256 105 H288\" stroke=\"#6B3A84\" stroke-width=\"3\"/><path d=\"M288 99 l9 6 l-9 6 z\" fill=\"#6B3A84\"/>\n<polygon points=\"366.2,123.0 335.0,141.0 303.8,123.0 303.8,87.0 335.0,69.0 366.2,87.0\" fill=\"#FFF0B8\" stroke=\"#C98A12\" stroke-width=\"3\"/>\n<text x=\"335\" y=\"111\" text-anchor=\"middle\" font-family=\"Segoe UI,DejaVu Sans,Arial,sans-serif\" font-size=\"15\" font-weight=\"800\" fill=\"#2E6F8E\">80%</text>\n<text x=\"335\" y=\"160\" text-anchor=\"middle\" font-family=\"Segoe UI,DejaVu Sans,Arial,sans-serif\" font-size=\"13.5\" font-weight=\"700\" fill=\"#2B1A33\">3. wax cell</text>\n<text x=\"335\" y=\"177\" text-anchor=\"middle\" font-family=\"Segoe UI,DejaVu Sans,Arial,sans-serif\" font-size=\"12\" fill=\"#6A5B70\">nectar = up to 80% water</text>\n<path d=\"M380 105 H412\" stroke=\"#6B3A84\" stroke-width=\"3\"/><path d=\"M412 99 l9 6 l-9 6 z\" fill=\"#6B3A84\"/>\n<polygon points=\"496.2,123.0 465.0,141.0 433.8,123.0 433.8,87.0 465.0,69.0 496.2,87.0\" fill=\"#FFD27A\" stroke=\"#C98A12\" stroke-width=\"3\"/>\n<text x=\"465\" y=\"111\" text-anchor=\"middle\" font-family=\"Segoe UI,DejaVu Sans,Arial,sans-serif\" font-size=\"15\" font-weight=\"800\" fill=\"#B26A00\">18%</text>\n<g transform=\"translate(465 48) rotate(0) scale(0.8)\">\n<ellipse cx=\"-6\" cy=\"-16\" rx=\"14\" ry=\"9\" fill=\"#CFE8F5\" stroke=\"#7FA9C0\" stroke-width=\"1.5\" transform=\"rotate(-25 -6 -16)\"/>\n<ellipse cx=\"8\" cy=\"-17\" rx=\"13\" ry=\"8\" fill=\"#CFE8F5\" stroke=\"#7FA9C0\" stroke-width=\"1.5\" transform=\"rotate(20 8 -17)\"/>\n<ellipse cx=\"0\" cy=\"0\" rx=\"22\" ry=\"13\" fill=\"#FFC94A\" stroke=\"#2B1A33\" stro nt-weight=\"800\" fill=\"#C0392B\">Straight \"waggle\" run:</text>\n<text x=\"345\" y=\"100\">• its DIRECTION shows which way to fly</text>\n<text x=\"345\" y=\"120\">• its LENGTH shows how far away</text><text x=\"357\" y=\"138\">the flowers are</text>\n<text x=\"345\" y=\"170\" font-weight=\"800\" fill=\"#6B3A84\">Loops on each side:</text>\n<text x=\"345\" y=\"190\">the bee walks back and dances again,</text>\n<text x=\"345\" y=\"210\">making a figure-of-eight</text>\n</g>\n<text x=\"20\" y=\"246\" font-family=\"Segoe UI,DejaVu Sans,Arial,sans-serif\" font-size=\"12.5\" fill=\"#6A5B70\">Karl von Frisch explained this dance and won a Nobel Prize in 1973.</text>\n</svg>", "cap": "The waggle dance tells other bees where the flowers are."}, {"after": 4, "svg": "<svg viewBox=\"0 0 640 250\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"A bee's head with two large eyes and three small eyes; bees see red as dark but can see ultraviolet patterns on flowers\">\n<rect width=\"640\" height=\"250\" rx=\"16\" fill=\"#FFF7E6\"/>\n<text x=\"20\" y=\"28\" font-family=\"Segoe UI,DejaVu Sans,Arial,sans-serif\" font-size=\"16\" font-weight=\"800\" fill=\"#6B3A84\">How a bee sees</text>\n<ellipse cx=\"140\" cy=\"140\" rx=\"70\" ry=\"78\" fill=\"#FFC94A\" stroke=\"#2B1A33\" stroke-width=\"3\"/>\n<ellipse cx=\"88\" cy=\"140\" rx=\"24\" ry=\"44\" fill=\"#2B1A33\"/><ellipse cx=\"192\" cy=\"140\" rx=\"24\" ry=\"44\" fill=\"#2B1A33\"/>\n<circle cx=\"80\" cy=\"122\" r=\"6\" fill=\"#fff\" opacity=\".7\"/><circle cx=\"184\" cy=\"122\" r=\"6\" fill=\"#fff\" opacity=\".7\"/>\n<circle cx=\"140\" cy=\"88\" r=\"8\" fill=\"#2B1A33\"/><circle cx=\"122\" cy=\"102\" r=\"7\" fill=\"#2B1A33\"/><circle cx=\"158\" cy=\"102\" r=\"7\" fill=\"#2B1A33\"/>\n<path d=\"M118 66 q-12 -30 -30 -34 M162 66 q12 -30 30 -34\" stroke=\"#2B1A33\" stroke-width=\"3\" fill=\"none\"/>\n<text x=\"230\" y=\"98\" font-family=\"Segoe UI,DejaVu Sans,Arial,sans-serif\" font-size=\"13\" fill=\"#2B1A33\">← 3 small eyes on top</text>\n<text x=\"230\" y=\"160\" font-family=\"Segoe UI,DejaVu Sans,Arial,sans-serif\" font-size=\"13\" fill=\"#2B1A33\">← 2 large eyes</text>\n<text x=\"230\" y=\"178\" font-family=\"Segoe UI,DejaVu Sans,Arial,sans-serif\" font-size=\"13\" font-weight=\"800\" fill=\"#6B3A84\">= 5 eyes</text>\n<g transform=\"translate(400 0)\">\n<text x=\"0\" y=\"62\" font-family=\"Segoe UI,DejaVu Sans,Arial,sans-serif\" font-size=\"13.5\" font-weight=\"700\" fill=\"#2B1A33\">We see:</text>\n<text x=\"120\" y=\"62\" font-family=\"Segoe UI,DejaVu Sans,Arial,sans-serif\" font-size=\"13.5\" font-weight=\"700\" fill=\"#2B1A33\">A bee sees:</text>\n<circle cx=\"35\" cy=\"95\" r=\"20\" fill=\"#D7263D\"/><circle cx=\"155\" cy=\"95\" r=\"20\" fill=\"#2A2A2A\"/>\n<text x=\"95\" y=\"100\" text-anchor=\"middle\" font-family=\"Segoe UI,DejaVu Sans,Arial,sans-serif\" font-size=\"16\">→</text>\n<text x=\"95\" y=\"130\" text-anchor=\"middle\" font-family=\"Segoe UI,DejaVu Sans,Arial,sans-serif\" font-size=\"12\" fill=\"#6A5B70\">red looks dark: bees cannot see red</text>\n<circle cx=\"53.0\" cy=\"185.0\" r=\"11.2\" fill=\"#FFE066\"/><circle cx=\"40.6\" cy=\"202.1\" r=\"11.2\" fill=\"#FFE066\"/><circle cx=\"20.4\" cy=\"195.6\" r=\"11.2\" fill=\"#FFE066\"/><circle cx=\"20.4\" cy=\"174.4\" r=\"11.2\" fill=\"#FFE066\"/><circle cx=\"40.6\" cy=\"167.9\" r=\"11.2\" fill=\"#FFE066\"/><circle cx=\"35\" cy=\"185\" r=\"9.9\" fill=\"#FFD84D\"/>\n<g><circle cx=\"173.0\" cy=\"185.0\" r=\"11.2\" fill=\"#FFE066\"/><circle cx=\"160.6\" cy=\"202.1\" r=\"11.2\" fill=\"#FFE066\"/><circle cx=\"140.4\" cy=\"195.6\" r=\"11.2\" fill=\"#FFE066\"/><circle cx=\"140.4\" cy=\"174.4\" r=\"11.2\" fill=\"#FFE066\"/><circle cx=\"160.6\" cy=\"167.9\" r=\"11.2\" fill=\"#FFE066\"/><circle cx=\"155\" cy=\"185\" r=\"9.9\" fill=\"#FFD84D\"/><path d=\"M155 185 L155 160 M155 185 L177 177 M155 185 L169 205 M155 185 L141 205 M155 185 L133 177\" stroke=\"#7B4FC9\" stroke-width=\"5\" stroke-linecap=\"round\"/><circle cx=\"155\" cy=\"185\" r=\"8\" fill=\"#7B4FC9\"/></g>\n<text x=\"95\" y=\"190\" text-anchor=\"middle\" font-family=\"Segoe UI,DejaVu Sans,Arial,sans-serif\" font-size=\"16\">→</text>\n<text x=\"95\" y=\"232\" text-anchor=\"middle\" font-family=\"Segoe UI,DejaVu Sans,Arial,sans-serif\" font-size=\"12\" fill=\"#6A5B70\">ultraviolet patterns lead bees to the nectar</text>\n</g>\n</svg>", "cap": "Bees have five eyes and see colours differently from us."}]}, "B": {"title": "Honey: Sweet, Old and Special", "paras": ["There is a famous story that archaeologists found 3,000-year-old honey in an Egyptian tomb and ate it. Jars of honey really have been found in ancient tombs, but many experts now say the tasting story is probably a myth. What is true is that honey in a closed jar can stay good for many years.", "Honey lasts a long time for three reasons. First, it contains very little water, so bacteria cannot live in it. Second, it is acidic. Third, it contains a tiny amount of hydrogen peroxide, a chemical that kills germs. However, honey can take water from the air, so always keep the lid closed.", "Sometimes honey becomes hard and cloudy. This is called crystallisation, and it is completely natural. The honey is still safe to eat. To make it soft again, put the jar in a bowl of warm water for a few minutes.", "In the UAE, bees make honey from the flowers of three main trees: Sidr, Samar and Ghaf. Sidr trees grow well in the UAE's hot, dry land. Sidr honey is collected from September to December. It is dark and rich, and a one-kilo jar can cost hundreds of dirhams.", "Every December, Dubai Municipality organises the Hatta Honey Festival, where around 50 Emirati beekeepers sell and show their honey. In many families, a teaspoon of honey is also a traditional remedy for a sore throat."], "gloss": [["archaeologist", "عالم آثار"], ["tomb", "مقبرة"], ["myth", "خرافة / أسطورة"], ["bacteria", "بكتيريا"], ["acidic", "حمضي"], ["germs", "جراثيم"], ["lid", "غطاء"], ["cloudy", "عَكِر / غير صافٍ"], ["crystallisation", "التبلّر"], ["beekeeper", "نحّال"], ["remedy", "علاج"], ["sore throat", "التهاب الحلق"]], "bonus": ["Did you know? Around 4,000 years ago, people in Sumer (in modern Iraq) wrote medical recipes on clay tablets, and many of them used honey.", "Bonus: What does your family use honey for? Write one sentence and tell your partner."], "figs": [{"after": 1, "svg": "<svg viewBox=\"0 0 660 250\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Three reasons honey lasts: very little water, acidic, hydrogen peroxide; keep the lid closed\">\n<rect width=\"660\" height=\"250\" rx=\"16\" fill=\"#FFF7E6\"/>\n<text x=\"20\" y=\"28\" font-family=\"Segoe UI,DejaVu Sans,Arial,sans-serif\" font-size=\"16\" font-weight=\"800\" fill=\"#6B3A84\">Why honey lasts so long</text>\n<g font-family=\"Segoe UI,DejaVu Sans,Arial,sans-serif\" text-anchor=\"middle\">\n<circle cx=\"80\" cy=\"95\" r=\"34\" fill=\"#E3F1F8\" stroke=\"#4B8FB0\" stroke-width=\"3\"/><text x=\"80\" y=\"104\" font-size=\"26\">💧</text><line x1=\"56\" y1=\"71\" x2=\"104\" y2=\"119\" stroke=\"#C0392B\" stroke-width=\"4\"/>\n<text x=\"80\" y=\"150\" font-size=\"13.5\" font-weight=\"700\" fill=\"#2B1A33\">1. very little water</text><text x=\"80\" y=\"167\" font-size=\"12\" fill=\"#6A5B70\">bacteria cannot live</text>\n<circle cx=\"230\" cy=\"95\" r=\"34\" fill=\"#FFF0B8\" stroke=\"#E39B0B\" stroke-width=\"3\"/><text x=\"230\" y=\"103\" font-size=\"18\" font-weight=\"900\" fill=\"#B26A00\">pH 4</text>\n<text x=\"230\" y=\"150\" font-size=\"13.5\" font-weight=\"700\" fill=\"#2B1A33\">2. acidic</text><text x=\"230\" y=\"167\" font-size=\"12\" fill=\"#6A5B70\">stops germs</text>\n<circle cx=\"380\" cy=\"95\" r=\"34\" fill=\"#E8F5EE\" stroke=\"#2E7D6B\" stroke-width=\"3\"/><text x=\"380\" y=\"103\" font-size=\"17\" font-weight=\"900\" fill=\"#2E7D6B\">H₂O₂</text>\n<text x=\"380\" y=\"150\" font-size=\"13.5\" font-weight=\"700\" fill=\"#2B1A33\">3. hydrogen peroxide</text><text x=\"380\" y=\"167\" font-size=\"12\" fill=\"#6A5B70\">kills germs</text>\n</g>\n<line x1=\"460\" y1=\"50\" x2=\"460\" y2=\"200\" stroke=\"#E8D9BE\" stroke-width=\"2\" stroke-dasharray=\"6 6\"/>\n<rect x=\"480.0\" y=\"77.0\" width=\"70\" height=\"86\" rx=\"14\" fill=\"#fff\" stroke=\"#2B1A33\" stroke-width=\"3\"/><rect x=\"485.0\" y=\"93.0\" width=\"60\" height=\"65\" rx=\"10\" fill=\"#E39B0B\"/><rect x=\"476.0\" y=\"65.0\" width=\"78\" height=\"16\" rx=\"5\" fill=\"#6B3A84\"/>\n<text x=\"515\" y=\"190\" text-anchor=\"middle\" font-family=\"Segoe UI,DejaVu Sans,Arial,sans-serif\" font-size=\"12.5\" font-weight=\"700\" fill=\"#2E7D6B\">✔ lid closed</text>\n<g transform=\"translate(612 0)\"><rect x=\"-24.0\" y=\"96.0\" width=\"48\" height=\"64\" rx=\"14\" fill=\"#fff\" stroke=\"#2B1A33\" stroke-width=\"3\"/><rect x=\"-19.0\" y=\"112.0\" width=\"38\" height=\"43\" rx=\"10\" fill=\"#E39B0B\"/><path d=\"M-14 72 q8 -14 0 -26 M2 70 q8 -14 0 -26\" stroke=\"#4B8FB0\" stroke-width=\"2.5\" fill=\"none\"/></g>\n<text x=\"612\" y=\"190\" text-anchor=\"middle\" font-family=\"Segoe UI,DejaVu Sans,Arial,sans-serif\" font-size=\"11.5\" font-weight=\"700\" fill=\"#C0392B\">✘ open: takes</text>\n<text x=\"612\" y=\"205\" text-anchor=\"middle\" font-family=\"Segoe UI,DejaVu Sans,Arial,sans-serif\" font-size=\"11.5\" font-weight=\"700\" fill=\"#C0392B\">water from air</text>\n</svg>", "cap": "Three reasons why honey can stay good for many years."}, {"after": 2, "svg": "<svg viewBox=\"0 0 640 220\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Hard cloudy honey becomes soft again after a few minutes in a bowl of warm water\">\n<rect width=\"640\" height=\"220\" rx=\"16\" fill=\"#FFF7E6\"/>\n<text x=\"20\" y=\"28\" font-family=\"Segoe UI,DejaVu Sans,Arial,sans-serif\" font-size=\"16\" font-weight=\"800\" fill=\"#6B3A84\">Hard, cloudy honey? Don't throw it away!</text>\n<rect x=\"75.0\" y=\"69.0\" width=\"70\" height=\"86\" rx=\"14\" fill=\"#fff\" stroke=\"#2B1A33\" stroke-width=\"3\"/><rect x=\ ext x=\"514\" y=\"168\" text-anchor=\"middle\" font-family=\"Segoe UI,DejaVu Sans,Arial,sans-serif\" font-size=\"12\" font-weight=\"800\" fill=\"#fff\">Oct</text><rect x=\"541\" y=\"148\" width=\"42\" height=\"30\" rx=\"6\" fill=\"#E39B0B\"/><text x=\"562\" y=\"168\" text-anchor=\"middle\" font-family=\"Segoe UI,DejaVu Sans,Arial,sans-serif\" font-size=\"12\" font-weight=\"800\" fill=\"#fff\">Nov</text><rect x=\"589\" y=\"148\" width=\"42\" height=\"30\" rx=\"6\" fill=\"#E39B0B\"/><text x=\"610\" y=\"168\" text-anchor=\"middle\" font-family=\"Segoe UI,DejaVu Sans,Arial,sans-serif\" font-size=\"12\" font-weight=\"800\" fill=\"#fff\">Dec</text>\n<text x=\"540\" y=\"200\" text-anchor=\"middle\" font-family=\"Segoe UI,DejaVu Sans,Arial,sans-serif\" font-size=\"12.5\" fill=\"#6A5B70\">dark, rich and often expensive</text>\n</svg>", "cap": "Most UAE honey comes from the flowers of three trees."}]}, "Q": [{"type": "tf", "src": "A", "q": "All worker bees are male.", "a": "False", "why": "Every worker bee is female (Text A, paragraph 1)."}, {"type": "tf", "src": "B", "q": "Experts agree that people really ate 3,000-year-old honey from an Egyptian tomb.", "a": "False", "why": "Many experts say the tasting story is probably a myth (Text B, paragraph 1)."}, {"type": "short", "src": "A", "q": "In summer, a worker bee lives for about ______ weeks.", "a": "six", "accept": ["six", "6", "6 weeks", "six weeks"], "why": "Text A, paragraph 1."}, {"type": "mc", "src": "A+B", "q": "A teaspoon of honey can help a sore throat. How many bees work their whole lives to make that one teaspoon?", "options": ["About 80 bees", "About 12 bees", "About 6 bees", "Just 1 bee"], "a": 1, "why": "Text B: a teaspoon of honey for a sore throat. Text A: one bee makes 1/12 of a teaspoon, so 12 bees make one teaspoon."}, {"type": "short", "src": "B", "q": "Honey can take ______ from the air, so you should keep the lid closed.", "a": "water", "accept": ["water", "moisture"], "why": "Text B, paragraph 2."}, {"type": "mc", "src": "A", "q": "How does a bee carry nectar back to the hive?", "options": ["On her two back legs", "Under her soft wings", "In her honey stomach", "In a small wax cell"], "a": 2, "why": "Text A, paragraph 2."}, {"type": "mc", "src": "B", "q": "Honey is acidic. What else in honey kills germs?", "options": ["A small amount of salt", "A kind of natural vinegar", "Hydrogen peroxide", "Tiny pieces of lemon"], "a": 2, "why": "Text B, paragraph 2."}, {"type": "mc", "src": "A+B", "q": "Bacteria cannot live in honey because it has very little water. How do bees take the water out of the nectar?", "options": ["They fan their wings over it", "They leave it out in the sun", "They add a little sand to it", "They mix it with a lot of wax"], "a": 0, "why": "Text B: little water means no bacteria. Text A: bees fan their wings over the cells to dry the nectar."}, {"type": "short", "src": "A", "q": "Nectar can be up to ______ % water.", "a": "80", "accept": ["80", "80%", "eighty"], "why": "Text A, paragraph 2."}, {"type": "tf", "src": "B", "q": "When honey becomes hard and cloudy, it is not safe to eat.", "a": "False", "why": "Crystallisation is natural and the honey is still safe (Text B, paragraph 3)."}, {"type": "tf", "src": "A", "q": "On one trip, a bee visits 50 to 100 flowers.", "a": "True", "why": "Text A, paragraph 3."}, {"type": "short", "src": "B", "q": "To make hard honey soft again, put the jar in a bowl of ______ water.", "a": "warm", "accept": ["warm", "hot"], "why": "Text B, paragraph 3."}, {"type": "short", "src": "A+B", "q": "In the hive, bees close each cell with a wax lid. At home, we keep the honey jar closed. Both of these stop honey from taking in ______ .", "a": "water", "accept": ["water", "moisture", "water from the air"], "why": "Text A: bees close the cells with wax. Text B: honey can take water from the air."}, {"type": "mc", "src": "A", "q": "What makes the buzzing sound of a bee?", "options": ["Her very fast wings", "The waggle dance she does", "Her five small eyes", "The nectar inside her"], "a": 0, "why": "The wings beat about 200 times a second (Text A, paragraph 3)."}, {"type": "mc", "src": "B", "q": "Which tree is NOT one of the three main honey trees in the UAE?", "options": ["Sidr", "Samar", "Palm", "Ghaf"], "a": 2, "why": "The three trees are Sidr, Samar and Ghaf (Text B, paragraph 4)."}, {"type": "short", "src": "A", "q": "Who won a Nobel Prize for explaining the waggle dance?", "a": "Karl von Frisch", "accept": ["karl von frisch", "von frisch", "frisch", "karl frisch"], "why": "Text A, paragraph 4."}, {"type": "short", "src": "B", "q": "Sidr honey is collected from September to ______ .", "a": "December", "accept": ["december", "dec"], "why": "Text B, paragraph 4."}, {"type": "mc", "src": "A+B", "q": "A one-kilo jar of Sidr honey can cost hundreds of dirhams. How many flowers do bees visit to make just 450 grams of honey?", "options": ["Around 2 thousand", "Around 20 thousand", "Around 2 million", "Around 200 thousand"], "a": 2, "why": "Text B: Sidr honey is expensive. Text A: bees visit about two million flowers for one 450 g jar, which shows how much work is in each jar."}, {"type": "tf", "src": "A", "q": "Bees can see the colour red very well.", "a": "False", "why": "Bees cannot see red (Text A, paragraph 5)."}, {"type": "tf", "src": "B", "q": "Dubai Municipality organises the Hatta Honey Festival.", "a": "True", "why": "Text B, paragraph 5."}], "sources": [["Why honey never spoils (Smithsonian)", "https://www.smithsonianmag.com/smart-news/why-honey-never-spoils-1218690/"], ["Does honey go bad? The 3,000-year-old honey story (Buzz About Bees)", "https://www.buzzaboutbees.net/does-honey-go-bad.html"], ["How bees make honey (University of Sussex LASI)", "https://www.sussex.ac.uk/lasi/documents/pamphlet-howbeesmakeshoney-a4-1page-2011.pdf"], ["How is honey made? (Britannica)", "https://britannica.com/science/How-Is-Honey-Made"], ["Karl von Frisch (Wikipedia)", "https://en.wikipedia.org/wiki/Karl_von_Frisch"], ["Honey bee communication (ASU Ask A Biologist)", "https://askabiologist.asu.edu/honey-bee-communication"], ["Emirati beekeepers and the Hatta Honey Festival (The National)", "https://thenationalnews.com/uae/2023/12/31/emirati-beekeepers-on-climate-change-imported-bees-and-falling-honey-yields"], ["Hatta Honey Festival with 50+ Emirati beekeepers (Gulf News)", "https://gulfnews.com/uae/people/meet-emirati-dean-of-beekeeping-14-year-old-youngest-beekeeper-1.500008253"], ["Ghaf, Sidr and Samar honey trees (Khaleej Times)", "https://khaleejtimes.com/article/a-city-to-come-up-for-bees-in-hatta?amp=1"], ["1/12 teaspoon and 2 million flowers (Penn State Hort / National Honey Board figures)", "https://pennhort.libguides.com/beekeeping"]]};
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const LET="abcd";
const S={tab:"A",nA:"",nB:"",ans:{},checked:false,pen:"y",hl:{A:null,B:null}};
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove("show"),2800)}
const T=[["A","Student A","var(--A)"],["B","Student B","#D9B8EC"],["Q","Questions","var(--AB)"],["R","My result","#fff"]];

function tabs(){
  $("#tabs").innerHTML=T.map(([k,l,c])=>`<button role="tab" aria-selected="${S.tab===k}" data-tab="${k}"><span class="dot" style="background:${c}"></span>${l}</button>`).join("");
  document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{saveHL();S.tab=b.dataset.tab;render();window.scrollTo({top:0})});
}

/* ---------- text tabs ---------- */
function textTab(r){
  const P=D[r],other=r==="A"?"B":"A";
  return `<div class="warn ${r}">⚠️ <div>This is <b>Student ${r}'s</b> text. Student ${other}: please don't read this tab! Your partner will tell you about it.
     <div class="ar">هذا نص الطالبة ${r==="A"?"أ":"ب"}. الطالبة ${r==="A"?"ب":"أ"}: لا تقرئي هذه الصفحة!</div></div></div>
  <div class="grid">
   <article class="text ${r}"><span class="lab ${r}">TEXT ${r}</span><h2>${esc(P.title)}</h2>
    <div id="paras">${S.hl[r]||P.paras.map((p,k)=>`<p>${esc(p)}</p>`+(P.figs||[]).filter(f=>f.after===k).map(f=>`<figure class="fig" contenteditable="false">${f.svg}<figcaption>${esc(f.cap)}</figcaption></figure>`).join("")).join("")}</div>
   </article>
   <aside class="side"><h3>🖍️ Highlighter</h3>
    <div class="hlbar" role="group" aria-label="Highlighter">${[["y","Yellow"],["g","Green"],["p","Pink"]].map(([k,l])=>`<button class="pen ${k}" data-pen="${k}" aria-pressed="${S.pen===k}" aria-label="${l} highlighter" title="${l}"></button>`).join("")}<button class="pen er" data-pen="er" aria-pressed="${S.pen==="er"}" aria-label="Eraser" title="Eraser: tap a highlight to remove it">⌫</button></div>
    <p class="hlnote">Choose a colour, then select words in the text. Use ⌫ and tap a highlight to remove it.</p>
    <button class="clearhl" id="clr">Clear all my highlights</button>
    <h3>📖 Word help</h3>
    <ul class="words">${P.gloss.map(([w,a])=>`<li><b>${esc(w)}</b><span class="ar">${esc(a)}</span></li>`).join("")}</ul>
    <button class="btn full" id="toQ">Go to the questions →</button>
   </aside>
  </div>`;
}
function bindText(r){
  const box=$("#paras");
  document.body.classList.toggle("erase",S.pen==="er");
  document.querySelectorAll("[data-pen]").forEach(b=>b.onclick=()=>{S.pen=b.dataset.pen;document.querySelectorAll("[data-pen]").forEach(x=>x.setAttribute("aria-pressed",x===b));document.body.classList.toggle("erase",S.pen==="er")});
  $("#clr").onclick=()=>{box.querySelectorAll("mark.hl").forEach(unwrap);saveHL();toast("All highlights cleared")};
  $("#toQ").onclick=()=>{saveHL();S.tab="Q";render();window.scrollTo({top:0})};
  const doHL=()=>{
    if(S.pen==="er")return;
    const sel=getSelection();if(!sel.rangeCount||sel.isCollapsed)return;
    const rg=sel.getRangeAt(0);if(!box.contains(rg.commonAncestorContainer))return;
    if(rg.startContainer.nodeType===3){let o=rg.startOffset;const t=rg.startContainer.nodeValue;while(o>0&&/[A-Za-z0-9'’]/.test(t[o-1]))o--;rg.setStart(rg.startContainer,o)}
    if(rg.endContainer.nodeType===3){let o=rg.endOffset;const t=rg.endContainer.nodeValue;while(o<t.length&&/[A-Za-z0-9'’]/.test(t[o]))o++;rg.setEnd(rg.endContainer,o)}
    const pOf=n=>(n.nodeType===3?n.parentNode:n).closest("p");
    const p1=pOf(rg.startContainer),p2=pOf(rg.endContainer);
    if(!p1||p1!==p2){sel.removeAllRanges();return toast("Please highlight inside one paragraph at a time.")}
    if(!rg.toString().trim()){sel.removeAllRanges();return}
    const m=document.createElement("mark");m.className="hl "+S.pen;
    m.appendChild(rg.extractContents());
    m.querySelectorAll("mark.hl").forEach(unwrap);
    rg.insertNode(m);sel.removeAllRanges();box.normalize();saveHL();
  };
  box.addEventListener("mouseup",()=>setTimeout(doHL,0));
  box.addEventListener("touchend",()=>setTimeout(doHL,300));
  box.addEventListener("click",e=>{const m=e.target.closest("mark.hl");if(S.pen==="er"&&m){unwrap(m);box.normalize();saveHL()}});
}
function unwrap(m){const p=m.parentNode;while(m.firstChild)p.insertBefore(m.firstChild,m);p.removeChild(m)}
function saveHL(){const b=$("#paras");if(b&&(S.tab==="A"||S.tab==="B"))S.hl[S.tab]=b.innerHTML}

/* ---------- questions ---------- */
function teamBox(){return `<div class="team"><h3>👭 Our team</h3>
  <div class="a"><label for="nA">Student A's name</label><input type="text" id="nA" value="${esc(S.nA)}" autocomplete="off" placeholder="Type a name"></div>
  <div class="b"><label for="nB">Student B's name</label><input type="text" id="nB" value="${esc(S.nB)}" autocomplete="off" placeholder="Type a name"></div></div>`}
function srcTag(s){const k=s==="A+B"?"AB":s;return `<span class="src ${k}">${s==="A+B"?"Both texts":"Text "+s}</span>`}
function questionsTab(){
  return teamBox()+`<section class="sec"><span class="lab AB">WORK WITH YOUR PARTNER</span><h2>Honey questions</h2>
   <p class="inst">Answer all 20 questions together. Some answers are in your text, some are in your partner's text, and some need <b>both</b> texts. Talk to each other, but don't show your screen! <span class="ar">أجيبا معاً، ولا تُريا الشاشة لبعضكما!</span></p>
   ${D.Q.map((q,i)=>{
     const a=S.ans[i];let body="";
     if(q.type==="tf")body=`<div class="tfrow">${["True","False"].map(v=>`<button class="opt" data-q="${i}" data-v="${v}" aria-pressed="${a===v}">${v}</button>`).join("")}</div>`;
     if(q.type==="mc")body=`<div class="opts">${q.options.map((o,j)=>`<button class="opt" data-q="${i}" data-v="${j}" aria-pressed="${a===String(j)}"><span class="lt">${LET[j]}</span>${esc(o)}</button>`).join("")}</div>`;
     if(q.type==="short")body=`<input class="short" data-q="${i}" value="${esc(a||"")}" autocomplete="off" placeholder="Type your answer">`;
     return `<div class="q" id="q${i}"><div class="qh"><span class="num">${i+1}</span><div class="qt">${esc(q.q)}</div></div>${body}<div class="fb"></div></div>`;
   }).join("")}
   <div class="row noprint"><button class="btn" id="ck">✔ Check our answers</button>${S.checked?`<button class="btn ghost" id="again">↺ Try again</button>`:""}</div>
  </section>`;
}
function norm(s){return String(s||"").trim().toLowerCase().replace(/[.!?"]/g,"").replace(/\s+/g," ")}
function right(i){const q=D.Q[i],a=S.ans[i];if(a==null||a==="")return false;
  if(q.type==="tf")return a===q.a; if(q.type==="mc")return +a===q.a;
  return q.accept.includes(norm(a))}
function score(){const m={A:[0,0],B:[0,0],"A+B":[0,0]};D.Q.forEach((q,i)=>{m[q.src][1]++;if(right(i))m[q.src][0]++});const tot=D.Q.filter((q,i)=>right(i)).length;return {m,tot,max:D.Q.length}}
function markAll(){
  D.Q.forEach((q,i)=>{const c=$("#q"+i),ok=right(i);c.classList.add("done");c.classList.toggle("right",ok);c.classList.toggle("wrong",!ok);
    if(q.type==="tf")c.querySelector(`[data-v="${q.a}"]`).classList.add("correct");
    if(q.type==="mc")c.querySelector(`[data-v="${q.a}"]`).classList.add("correct");
    const ans=q.type==="mc"?`${LET[q.a]}) ${q.options[q.a]}`:q.a;
    c.querySelector(".fb").innerHTML=`${srcTag(q.src)}${ok?"✅ <b>Correct!</b> ":`❌ <b>Answer:</b> ${esc(ans)}. `}${esc(q.why)}`;
  });
}
function bindQ(){
  const nA=$("#nA"),nB=$("#nB");
  nA.oninput=()=>{S.nA=nA.value;const c=$("#cA");if(c)c.textContent=S.nA||"Student A"};
  nB.oninput=()=>{S.nB=nB.value;const c=$("#cB");if(c)c.textContent=S.nB||"Student B"};
  document.querySelectorAll(".opt[data-q]").forEach(b=>b.onclick=()=>{if(S.checked)return;const i=b.dataset.q;S.ans[i]=b.dataset.v;b.parentNode.querySelectorAll(".opt").forEach(x=>x.setAttribute("aria-pressed",x===b))});
  document.querySelectorAll(".short").forEach(inp=>inp.oninput=()=>{S.ans[inp.dataset.q]=inp.value});
  if(S.checked)markAll();
  $("#ck").onclick=()=>{
    if(S.checked){S.tab="R";render();return}
    if(!S.nA.trim()||!S.nB.trim()){toast("Write both team names at the top first.");(!S.nA.trim()?nA:nB).focus();window.scrollTo({top:0,behavior:"smooth"});return}
    const miss=D.Q.map((q,i)=>(S.ans[i]==null||String(S.ans[i]).trim()==="")?i+1:0).filter(Boolean);
    if(miss.length){toast("Please answer every question. Missing: "+miss.join(", "));return}
    S.checked=true;markAll();
    $("#ck").textContent="See our result →";
    const sc=score();toast(`You scored ${sc.tot} / ${sc.max}! Scroll to see the answers, or open My result.`);
    if(sc.tot>=Math.ceil(sc.max*.8))confetti();
  };
  const ag=$("#again");if(ag)ag.onclick=()=>{S.ans={};S.checked=false;render();toast("Answers cleared. Try again together!")};
}

/* ---------- result ---------- */
function resultTab(){
  if(!S.checked)return `<div class="res empty">Answer the questions with your partner and press <b>Check our answers</b> first. 🐝</div>`;
  const m=score(),pass=m.tot>=Math.ceil(m.max*.8);
  return `<div class="res"><div class="row" style="margin-top:0;align-items:center"><div class="big">${m.tot} / ${m.max}</div>
   <div><b style="font-size:22px">${pass?"Fantastic teamwork! 🍯":"Good effort! 🐝"}</b><br>${pass?"You shared your information well and helped each other.":"You need 16 / 20 for the team certificate. Go back to the Questions tab, look at the answers, then press Try again."}</div></div>
   <div class="split">
    <div class="sp A">Text A questions<b>${m.m.A[0]} / ${m.m.A[1]}</b></div>
    <div class="sp B">Text B questions<b>${m.m.B[0]} / ${m.m.B[1]}</b></div>
    <div class="sp AB">Both texts<b>${m.m["A+B"][0]} / ${m.m["A+B"][1]}</b></div>
   </div>
   <p class="inst">Tip: if one text has a low score, the answers in that text were not explained clearly enough. Read that text together now.</p>
   ${pass?`<div class="noprint">${teamBox()}</div>
   <div class="cert"><div class="seal">TEAM<br>READERS<br>🐝</div><div style="font-size:42px">🐝🍯🐝</div><h4>Team Certificate</h4><div>This certifies that</div>
    <div class="nm"><span id="cA">${esc(S.nA)||"Student A"}</span> &amp; <span id="cB">${esc(S.nB)||"Student B"}</span></div>
    <div>worked together as a team to complete the jigsaw reading <i>Honey: Bees, Science and the UAE</i>,<br>sharing information and helping each other, with a score of <b>${m.tot} / ${m.max}</b>.</div>
    <div style="margin-top:8px">${new Date().toLocaleDateString("en-GB",{day:"numeric",month:"long",year:"numeric"})}</div>
    <div style="margin-top:14px;font-family:var(--serif);font-style:italic">Designed by: Nazila Motahari · Higher Colleges of Technology</div></div>
   <div class="row noprint"><button class="btn amber" id="pr">🖨️ Print / Save as PDF</button></div>`:""}
  </div>`;
}
function bindR(){
  const pr=$("#pr");if(pr)pr.onclick=()=>window.print();
  const nA=$("#nA"),nB=$("#nB");
  if(nA)nA.oninput=()=>{S.nA=nA.value;$("#cA").textContent=S.nA||"Student A"};
  if(nB)nB.oninput=()=>{S.nB=nB.value;$("#cB").textContent=S.nB||"Student B"};
  if(S.checked&&score().tot>=16)confetti();
}

function render(){
  tabs();const A=$("#app");
  if(S.tab==="A"||S.tab==="B"){A.innerHTML=textTab(S.tab);bindText(S.tab)}
  else{document.body.classList.remove("erase");
    if(S.tab==="Q"){A.innerHTML=questionsTab();bindQ()}
    else{A.innerHTML=resultTab();bindR()}}
}
function confetti(){
  const c=$("#cf"),x=c.getContext("2d");c.width=innerWidth;c.height=innerHeight;
  const col=["#E39B0B","#FFC94A","#6B3A84","#2E7D6B","#F9C6D8"];
  const P=Array.from({length:160},()=>({x:Math.random()*c.width,y:-Math.random()*c.height*.6,r:5+Math.random()*6,c:col[Math.random()*5|0],v:2+Math.random()*3,h:-1.5+Math.random()*3,a:Math.random()*6}));
  let f=0;(function t(){x.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.y+=p.v;p.x+=p.h;p.a+=.1;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.c;x.fillRect(-p.r/2,-p.r/2,p.r,p.r*1.5);x.restore()});if(++f<220)requestAnimationFrame(t);else x.clearRect(0,0,c.width,c.height)})();
}
render();
</script>
</body>
